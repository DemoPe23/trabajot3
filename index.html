<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operación Extracción - T3</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
        /* Mira en el centro exacto de la pantalla */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: rgba(0, 255, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        /* HUD de Munición */
        #hud {
            position: absolute; bottom: 20px; right: 30px;
            color: white; font-size: 24px; font-weight: bold;
            background: rgba(0, 0, 0, 0.6); padding: 15px; border-radius: 8px;
        }
        /* Pantallas de estado (Inicio, Game Over, Victoria) */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 32px; text-align: center; cursor: pointer;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="hud">Arma: <span id="weapon-name">1</span> | Munición: <span id="ammo-count">10</span></div>
    <div id="overlay">
        <h1 id="overlay-title">OPERACIÓN EXTRACCIÓN</h1>
        <p id="overlay-sub">Haz clic para capturar el mouse y comenzar (WASD + Mouse)</p>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
